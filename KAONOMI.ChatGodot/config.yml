# Kaonomi Chat configuration (copied next to the executable on build).
# Relative paths are resolved from the executable folder.

ollamaUrl: http://localhost:11434

# Base URL of the Kaonomi REST server (completion, cache, ontology, symbolic patterns, logs, notes, evaluations...).
serverUrl: https://localhost:49165

# The engines of KAONOMI stopped by /bye before the chat closes: the search engine first (POST /_shutdown of
# KAONOMI.SearchEngine, which writes its indices), then the Mongo engine (the shutdown command of MongoDB). An engine
# that is not running is left alone. byeStopsEngines: off keeps them running.
searchEngineUrl: http://localhost:9200
mongoEngineAddress: localhost:27017

# KAONOMI.LLMGateway, the gateway in front of Ollama (semantic cache, router of the models by the entities of the
# prompt): /gateway drives it, /process starts it. The server and the agents use it when their ollamaUrl points to it.
llmGatewayUrl: http://localhost:11435
byeStopsEngines: off

# A window of the desktop not used for this many seconds (no click, key, wheel or drag in it; its animations do not
# count) closes by itself; a window with changes not saved is kept. 0 never closes them.
windowIdleCloseSeconds: 300

# Language of the application (e.g. FR, EN).
language: FR

streaming:
  # Answers are shown word by word, at the pace of someone reading them aloud (simulated streaming).
  enabled: true
  # Duration of one spoken syllable in milliseconds (about 200 = normal speech; lower = faster).
  syllableMs: 200
  # Display speed of the answers: 1 = reading pace, 2 = twice as fast, 0.5 = twice as slow (0.1 to 20).
  speed: 5

json:
  resultDirectory: /Users/jerome/kaonomi/jsonresult
  collectionDirectory: /Users/jerome/kaonomi/jsoncollection

prompts:
  # Folder of the prompts saved / loaded with the buttons above the chat input box.
  directory: /Users/jerome/kaonomi/promptscollection
  # true: a prompt loaded with "Load prompt" is sent at once; false (or off): it waits in the input box for Enter.
  directprompt: false

regexAssistant:
  # Folder of the regexes saved / loaded (JSON: goal, examples, regex) by the regex assistant of the /symbol window.
  directory: /Users/jerome/kaonomi/regexcollection

pictures:
  # Root folder of the picture library opened by /pictures (or /picture). The Pictures folder of the system is used when
  # this key is missing or the folder does not exist (macOS: ~/Pictures, Windows: the Pictures library).
  directory: /Users/jerome/Pictures

music:
  # Root folder of the music player opened by /music. The Music folder of the system is used when this key is missing or
  # the folder does not exist (macOS: ~/Music, Windows: the Music library).
  directory: /Users/jerome/Music

speech:
  # Voice input of the chat: hold the 🎤 button next to Send, speak, release: the text goes in the message box and is
  # sent. Speech is recognised on this machine by Whisper (whisper.cpp, open source). Language at start: fr, de, en or
  # ja (French by default; it can be changed next to the button).
  language: fr
  # ggml model of whisper.cpp, multilingual (https://huggingface.co/ggerganov/whisper.cpp).
  model: ~/kaonomi/models/ggml-small-q5_1.bin

calculator:
  # Folder of the pictures of the graphs taken with 📷 Camera in the graph of /work (added to the tape). Created when
  # the first picture is saved; the Pictures folder of the system, kaonomi/maths, when this key is missing.
  graphDirectory: /Users/jerome/Pictures/kaonomi/maths

fooocus:
  # Installed Fooocus whose Python runs the Fooocus API of /fooocus (started from /process): the folder of its launch.py,
  # or the folder of the portable Windows build (the one of run.bat, beside python_embeded). When this key is empty,
  # FOOOCUS_HOME, ~/kaonomi/fooocus and ~/pinokio/api/fooocus.git/app are tried.
  directory: ""

ontology:
  # Standard named-entity types (NER), OntoNotes 5 label set, as used by spaCy and most NER models.
  # CoNLL-2003 uses a reduced set: PER (= PERSON), LOC (= LOC + GPE + FAC), ORG, MISC (everything else).
  entityTypes:
    - PERSON        # People, including fictional characters
    - NORP          # Nationalities, religious or political groups
    - FAC           # Facilities: buildings, airports, highways, bridges
    - ORG           # Organizations: companies, agencies, institutions
    - GPE           # Geopolitical entities: countries, cities, states
    - LOC           # Non-GPE locations: mountain ranges, bodies of water, regions
    - PRODUCT       # Objects, vehicles, foods, software (not services)
    - EVENT         # Named events: wars, hurricanes, sports events
    - WORK_OF_ART   # Titles of books, songs, films, paintings
    - LAW           # Named documents made into laws
    - LANGUAGE      # Any named language
    - DATE          # Absolute or relative dates or periods
    - TIME          # Times smaller than a day
    - PERCENT       # Percentages, including "%"
    - MONEY         # Monetary values, including unit
    - QUANTITY      # Measurements: weight, distance, volume
    - ORDINAL       # "first", "second", ...
    - CARDINAL      # Numerals that do not fall under another type
    - HARDWARE      # Hardware devices, components, and peripherals
    - SOFTWARE      # Software applications and systems
    - FOOD          # Food and beverage items, including ingredients
    - MATHEMATIC    # Mathematical concepts and expressions
    - AI            # Artificial intelligence systems and applications
    - OTHERS        # Unclassified
    - CLASS         # Ontology Class


# true: the answers are read aloud with Piper (settings in "tts" below); false (or off): no text to speech.
text2speech: true

tts:
  # Piper: local, open source text to speech (https://github.com/OHF-voice/piper1-gpl).
  # Piper executable (installed with: python3 -m venv venv && venv/bin/pip install piper-tts). When it is not found, the
  # venv of the other system (venv\Scripts\piper.exe on Windows), ~/kaonomi/piper/venv and the PATH are tried.
  piper: /Users/jerome/kaonomi/piper/venv/bin/piper
  # Folder of the voice models. A voice is added with (from /Users/jerome/kaonomi/piper):
  #   venv/bin/python -m piper.download_voices --data-dir voices <voice>     e.g. fr_FR-tom-medium
  voicesDirectory: /Users/jerome/kaonomi/piper/voices
  # Voice of each language; the one of "language" above is used. A voice name of voicesDirectory, or the path of an
  # .onnx file (its .onnx.json next to it). Quality: x_low < low < medium < high (better, but larger and slower).
  #
  # French (fr_FR):
  #   fr_FR-siwis-medium (f, installed)   fr_FR-siwis-low (f)   fr_FR-tom-medium (m, installed)   fr_FR-gilles-low (m, installed)
  #   fr_FR-upmc-medium (2 speakers: jessica (f), pierre (m))   fr_FR-mls_1840-low
  #   fr_FR-mls-medium (125 speakers, by number)
  # English, US (en_US):
  #   en_US-lessac-medium / -low / -high (f)   en_US-amy-medium / -low (f)   en_US-ryan-medium / -low / -high (m)
  #   en_US-joe-medium (m)   en_US-john-medium (m)   en_US-kristin-medium (f)   en_US-kathleen-low (f)
  #   en_US-norman-medium (m)   en_US-hfc_female-medium (f)   en_US-hfc_male-medium (m)   en_US-ljspeech-medium / -high (f)
  #   en_US-bryce-medium   en_US-danny-low   en_US-kusal-medium   en_US-mike-medium   en_US-reza_ibrahim-medium
  #   en_US-sam-medium   en_US-arctic-medium (18 speakers)   en_US-l2arctic-medium (24 speakers)
  #   en_US-libritts-high / en_US-libritts_r-medium (904 speakers)
  # English, UK (en_GB):
  #   en_GB-alan-medium / -low (m)   en_GB-alba-medium (f)   en_GB-cori-medium / -high (f)   en_GB-jenny_dioco-medium (f)
  #   en_GB-northern_english_male-medium (m)   en_GB-southern_english_female-low (f)
  #   en_GB-semaine-medium (4 speakers: prudence (f), poppy (f), spike (m), obadiah (m))
  #   en_GB-aru-medium (12 speakers)   en_GB-vctk-medium (109 speakers)
  # German (de_DE):
  #   de_DE-thorsten-medium / -low / -high (m)   de_DE-kerstin-low (f)   de_DE-ramona-low (f)   de_DE-eva_k-x_low (f)
  #   de_DE-karlsson-low (m)   de_DE-pavoque-low (m)   de_DE-mls-medium (236 speakers, by number)
  #   de_DE-thorsten_emotional-medium (8 speakers: neutral, amused, angry, disgusted, drunk, sleepy, surprised, whisper)
  # The language of the voice input (FR / DE / EN / JA next to the 🎤 button) picks the voice: a language without a voice
  # here takes a voice of that language installed in voicesDirectory.
  # Japanese (ja_JP): ja_JP-hi_fi_captain-medium (installed). Piper reads Japanese with the OpenJTalk phonemizer:
  #   venv/bin/pip install "piper-tts[ja]"   (from ~/kaonomi/piper; without it the Japanese voice gives no sound)
  voices:
    FR: fr_FR-tom-medium
    DE: de_DE-thorsten-high
    EN: en_US-john-medium
    JA: ja_JP-hi_fi_captain-medium
  # Speaker of the voices that have several (name or number, see above); first speaker when missing.
  speakers:
    # FR: pierre          # with fr_FR-upmc-medium
    # DE: neutral         # with de_DE-thorsten_emotional-medium
  # Speech speed: 1 = normal, 1.2 = 20 % faster, 0.8 = 20 % slower (0.25 to 4).
  speed: 1.3
  # Pitch of the voice: 1 = the voice as it is, 1.15 = 15 % higher, 0.9 = 10 % lower (0.5 to 2); the speed is kept.
  pitch: 0.9
  # Robotic effect on the voice: 0 = natural voice, 0.3 = slight, 1 = plainly robotic (a low buzz and a metallic
  # resonance added to the voice; it stays easy to understand). Kept between 0 and 1.
  robot: 1


# Number of previous exchanges (prompt + answer) written into each prompt under "Discussions précédentes",
# 0 to 20 (0 sends the prompt alone). Also set from the drop-down above the chat, which writes it here.
historyExchanges: 5

# on: the Model, Preset and History zone of the chat is shown; off: it is hidden. Also set with ⚙ in the chat header.
chatoptions: on

# on: the machine does not go to sleep while the chat runs (the screen can still turn off); off: it sleeps as usual.
keepawake: on

# Vision model of Ollama (it reads pictures): the ✨ Analyse of the image analysis window (/pictures, /fooocus, the
# pictures of /work) and the ✨ AI review of the /work document. Installed with: ollama pull <model>.
visionmodel: mistral-small3.2

# 3D animation of the Kaonomi band (above the chat): MARI (the 3D robot face whose mouth follows the voice and the
# streamed words; used when missing or unknown), JEROME (photo portrait in 3D, same moving mouth), HAL (red eye of a
# computer whose core and flare glow with the voice), JARVIS (holographic display: reticle, gyroscope rings, glowing core
# and voice spectrum, pulsing with the voice), CIRCUIT (android woman whose green circuits glow with the voice, moving
# mouth, blinking), MOTUKO (android woman in a white armour whose amber lights glow with the voice, moving mouth,
# blinking), KAONOMI (hooded robot whose single yellow eye glows with the voice), LIN (woman in green scrubs, moving
# mouth, blinking) or NONE (no animation, the band only shows the clock).
animation: JARVIS

# The default preset of the avatar: the one the chat starts with when nothing matches, and the one offered first by the
# Presets drop-down of /config, the picker of the chat and /remote. The other presets are stored in the search engine
# (the preset index of the Kaonomi server) and edited with /preset in the chat: the first time the search engine has no
# preset, the presets the chat knows are written to it. Applying a preset writes its voice (tts.voices.FR), pitch,
# speed, robot, vibrato, assistant and horror (tts), its 3D animation (animation) and its personality, added to the
# system prompt (persona).
#   voice: a French Piper voice of tts.voicesDirectory · pitch 0.5 to 2 · speed 0.25 to 4 · robot, vibrato, assistant,
#   horror 0 to 1 · animation: MARI, JEROME, HAL, MARIEKILLEUSE, MUSUKO, KAONAMI, PEPPER, GREEN, JEROMELIVE, MARVIN,
#   CIRCUIT, MOTUKO, KAONOMI, LIN, JARVIS or NONE · persona: optional
presets:
  - name: JARVIS
    description: "Male voice (tom), pitch 0.92, speed 1.05, faint metallic touch, AI assistant sheen, JARVIS animation"
    voice: fr_FR-tom-medium
    pitch: 0.92
    speed: 1.05
    robot: 0.12
    assistant: 1
    animation: JARVIS
# Godot chat: eve (dark, EVE Online), kaonomi (light), matrix (the digital rain of the film), ghost (Ghost in the Shell), analyst (the desk of an intelligence analyst, for long hours), minimal (white, minimalist), defense (a military command post), police (a dispatch center at night), trading (a trading floor of crypto and stocks); the theme chosen in the chat is kept in its preferences.
theme: kaonomi
